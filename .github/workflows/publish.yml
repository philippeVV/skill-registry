name: Publish

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "skr/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ci/requirements.txt

      - name: Validate all packages
        run: python ci/validate.py

      - name: Detect changes
        id: changes
        run: |
          pkg_changed=$(git diff --name-only HEAD~1...HEAD | grep '^packages/' | cut -d/ -f2 | sort -u)
          skr_changed=$(git diff --name-only HEAD~1...HEAD | grep '^skr/' | head -1)

          echo "packages<<EOF" >> "$GITHUB_OUTPUT"
          echo "$pkg_changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ -n "$skr_changed" ]; then
            echo "skr=true" >> "$GITHUB_OUTPUT"
          else
            echo "skr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag package versions
        if: steps.changes.outputs.packages != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            [ ! -d "packages/$pkg" ] && continue

            latest=$(git tag --list "${pkg}@*" --sort=-v:refname | head -n1)

            if [ -z "$latest" ]; then
              new_version="0.0.1"
            else
              version="${latest#*@}"
              major=$(echo "$version" | cut -d. -f1)
              minor=$(echo "$version" | cut -d. -f2)
              patch=$(echo "$version" | cut -d. -f3)
              new_version="${major}.${minor}.$((patch + 1))"
            fi

            tag="${pkg}@${new_version}"
            echo "Tagging $tag"
            git tag "$tag"
          done <<< "${{ steps.changes.outputs.packages }}"

          git push --tags

      - name: Rebuild index
        if: steps.changes.outputs.packages != ''
        run: python ci/build_index.py

      - name: Commit index
        if: steps.changes.outputs.packages != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketplace.json
          if git diff --cached --quiet; then
            echo "No index changes."
          else
            git commit -m "chore: rebuild index"
            git push
          fi

      - name: Tag skr version
        if: steps.changes.outputs.skr == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          latest=$(git tag --list "skr/v*" --sort=-v:refname | head -n1)

          if [ -z "$latest" ]; then
            new_version="0.0.1"
          else
            version="${latest#skr/v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            new_version="${major}.${minor}.$((patch + 1))"
          fi

          tag="skr/v${new_version}"
          echo "Tagging $tag"
          git tag "$tag"
          git push origin "$tag"
