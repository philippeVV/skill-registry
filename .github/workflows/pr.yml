name: PR Validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ci/requirements.txt

      - name: Detect changed packages
        id: changes
        run: |
          changed=$(git diff --name-only origin/main...HEAD | grep '^packages/' | cut -d/ -f2 | sort -u)
          if [ -z "$changed" ]; then
            echo "packages=" >> "$GITHUB_OUTPUT"
            echo "No package changes detected."
          else
            echo "packages<<EOF" >> "$GITHUB_OUTPUT"
            echo "$changed" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Changed packages: $changed"
          fi

      - name: Validate changed packages
        if: steps.changes.outputs.packages != ''
        run: |
          failed=0
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "--- Validating packages/$pkg ---"
            python ci/validate.py "packages/$pkg" || failed=1
          done <<< "${{ steps.changes.outputs.packages }}"
          exit $failed
