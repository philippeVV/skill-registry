name: Sync External Packages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install script dependencies
        run: cd .github/scripts && npm ci

      - name: Check upstream packages
        run: node .github/scripts/sync-upstream.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
